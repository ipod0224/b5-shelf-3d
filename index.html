<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>B5 小倉庫貨架 3D 圖</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #e9eef2;
      color: #18212b;
    }
    #app, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    /* 建立堆疊情境：CSS2DRenderer 會給標籤很大的 z-index，不框住就會蓋過調整面板與按鈕列 */
    #app { z-index: 0; }
    #標題區 {
      position: fixed;
      z-index: 10;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      padding: 10px 13px;
      border: 1px solid rgba(42, 52, 61, .18);
      border-radius: 10px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 3px 14px rgba(0, 0, 0, .12);
      backdrop-filter: blur(5px);
      pointer-events: none;
    }
    #標題區 h1 {
      margin: 0 0 4px;
      font-size: clamp(17px, 2.4vw, 25px);
      line-height: 1.2;
    }
    #標題區 p {
      margin: 0;
      color: #4c5965;
      font-size: clamp(11px, 1.5vw, 14px);
      white-space: normal;
      max-width: 46vw;
    }
    #視角按鈕 {
      position: fixed;
      z-index: 20;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      display: flex;
      gap: 6px;
      padding: 6px;
      border: 1px solid rgba(42, 52, 61, .18);
      border-radius: 11px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 3px 14px rgba(0, 0, 0, .12);
      backdrop-filter: blur(5px);
    }
    #視角按鈕 button {
      appearance: none;
      min-height: 38px;
      padding: 7px 11px;
      border: 1px solid #aab4bd;
      border-radius: 7px;
      background: #fff;
      color: #27313b;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    #視角按鈕 button:hover { background: #eef3f6; }
    #視角按鈕 button.active {
      border-color: #235f91;
      background: #2774ae;
      color: #fff;
    }
    #圖層 {
      position: fixed;
      z-index: 20;
      top: calc(max(12px, env(safe-area-inset-top)) + 58px);
      right: max(12px, env(safe-area-inset-right));
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      max-width: calc(100vw - 24px);
      padding: 6px 8px;
      border: 1px solid rgba(42, 52, 61, .18);
      border-radius: 11px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 3px 14px rgba(0, 0, 0, .12);
      font-size: 13px;
    }
    #圖層 span { color: #4c5965; font-weight: 700; }
    #圖層 button {
      padding: 6px 10px;
      border: 1px solid #aab4bd;
      border-radius: 999px;
      background: #fff;
      color: #8a949c;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    #圖層 button[aria-pressed="true"], #圖層 button[aria-expanded="true"] {
      border-color: #1f6e43;
      background: #e3f4ea;
      color: #1f5c39;
    }
    #圖層 button[aria-pressed="true"]::before, #圖層 button[aria-expanded="true"]::before { content: "✓ "; }
    #圖層 button:focus-visible, #視角按鈕 button:focus-visible, #移動 button:focus-visible {
      outline: 3px solid #f0b400;
      outline-offset: 2px;
    }
    #剖切 {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #4c5965;
      font-weight: 700;
    }
    #剖切 input { width: 110px; }
    #材料表 {
      position: fixed;
      z-index: 30;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(560px, calc(100vw - 32px));
      max-height: calc(100vh - 120px);
      overflow: auto;
      padding: 14px 16px;
      border-radius: 12px;
      background: #fff;
      color: #18212b;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
    }
    #材料表 h2 { margin: 0 0 8px; font-size: 17px; }
    #材料表 table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    #材料表 th, #材料表 td { padding: 6px 4px; border-bottom: 1px solid #e3e8ec; text-align: left; }
    #材料表 p { margin: 8px 0 0; color: #4c5965; font-size: 12px; }
    .關閉 {
      float: right;
      padding: 4px 10px;
      border: 1px solid #aab4bd;
      border-radius: 8px;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }
    #移動 {
      position: fixed;
      z-index: 20;
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }
    #移動 button {
      min-width: 76px;
      padding: 12px 14px;
      border: 1px solid #235f91;
      border-radius: 10px;
      background: rgba(39, 116, 174, .92);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #移動 button:active { background: #1b5584; }
    #操作提示 {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(24, 33, 43, .72);
      color: #fff;
      font-size: 12px;
      pointer-events: none;
      text-align: center;
      max-width: 40vw;
    }
    @media (max-width: 700px) {
      #圖層 {
        flex-wrap: wrap;
        justify-content: flex-start;
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
      }
      #操作提示 {
        top: calc(max(12px, env(safe-area-inset-top)) + 248px);
        bottom: auto;
        max-width: calc(100vw - 32px);
        width: max-content;
      }
    }
    #圖例 {
      position: fixed;
      z-index: 10;
      left: max(12px, env(safe-area-inset-left));
      bottom: max(12px, env(safe-area-inset-bottom));
      min-width: 150px;
      padding: 9px 12px;
      border: 1px solid rgba(42, 52, 61, .18);
      border-radius: 10px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 3px 14px rgba(0, 0, 0, .12);
      font-size: 12px;
      backdrop-filter: blur(5px);
      pointer-events: none;
    }
    #圖例 strong {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
    }
    .圖例列 {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 4px 0;
      white-space: nowrap;
    }
    .色塊 {
      width: 16px;
      height: 11px;
      flex: 0 0 auto;
      border: 1px solid rgba(0, 0, 0, .3);
      border-radius: 2px;
    }
    .貨架標籤 {
      padding: 4px 7px;
      border: 1px solid rgba(0, 0, 0, .35);
      border-radius: 5px;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
      pointer-events: none;
    }
    .高度標籤 {
      padding: 2px 4px;
      border: 1px solid rgba(39, 48, 56, .35);
      border-radius: 3px;
      background: rgba(255, 255, 255, .92);
      color: #1b232a;
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }
    .地面標籤 {
      padding: 2px 5px;
      border: 1px solid rgba(37, 48, 58, .25);
      border-radius: 4px;
      background: rgba(255, 255, 255, .88);
      color: #1d2933;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      pointer-events: none;
    }
    .尺寸標籤 {
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(26, 43, 56, .88);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      pointer-events: none;
    }
    #調整面板 {
      position: fixed;
      z-index: 15;
      left: max(12px, env(safe-area-inset-left));
      top: calc(max(12px, env(safe-area-inset-top)) + 88px);
      max-height: calc(100dvh - max(12px, env(safe-area-inset-top)) - 88px - 175px);
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    #調整面板 .lil-gui.root { --width: min(260px, calc(100vw - 24px)); }
    .面板說明 { padding: 4px 8px 6px; font-size: 11px; color: #b0b0b0; }
    .狀態列 { white-space: pre-line; color: #e0e0e0; }
    #最後編輯 { margin-top: 2px; }
    #調整面板 .lil-gui .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 680px) {
      #調整面板 {
        top: calc(max(12px, env(safe-area-inset-top)) + 196px);
        max-height: calc(100dvh - max(12px, env(safe-area-inset-top)) - 196px - 175px);
      }
      #標題區 {
        right: 12px;
        padding: 8px 10px;
      }
      #標題區 p { max-width: none; }
      #視角按鈕 {
        top: calc(max(12px, env(safe-area-inset-top)) + 86px);
      }
      #圖層 {
        top: calc(max(12px, env(safe-area-inset-top)) + 136px);
      }
      #視角按鈕 button {
        min-height: 35px;
        padding: 6px 9px;
        font-size: 13px;
      }
      #圖例 {
        padding: 7px 9px;
        font-size: 11px;
      }
      .貨架標籤 { font-size: 11px; }
    }
  </style>

  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@2.8.4/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <div id="app"></div>

  <header id="標題區">
    <h1>B5 小倉庫貨架 3D 圖</h1>
    <p id="副標">單位 cm｜第1層＝地板到板面，其餘＝層與層板面間距｜板厚 6mm</p>
    <p id="最後編輯">最後編輯：—</p>
  </header>

  <nav id="視角按鈕" aria-label="視角切換">
    <button type="button" data-view="立體" class="active">立體</button>
    <button type="button" data-view="俯視">俯視</button>
    <button type="button" data-view="門口">從門口看</button>
  </nav>

  <div id="圖層" role="group" aria-label="圖層開關">
    <span>圖層</span>
    <button type="button" data-layer="尺寸" aria-pressed="true">尺寸線</button>
    <button type="button" data-layer="層高" aria-pressed="true">層板高度</button>
    <button type="button" data-layer="名稱" aria-pressed="true">貨架名稱</button>
    <button type="button" data-layer="牆面" aria-pressed="true">牆面</button>
    <label id="剖切" for="剖切高度">剖切 <input id="剖切高度" type="range" min="20" max="400" step="5" value="400"> <output id="剖切值">全部</output></label>
    <button type="button" id="開材料表" aria-expanded="false" aria-controls="材料表">材料表</button>
  </div>
  <section id="材料表" role="dialog" aria-labelledby="材料表標題" hidden>
    <button type="button" class="關閉" data-close="材料表">關閉</button>
    <h2 id="材料表標題">層板材料表</h2>
    <table>
      <thead><tr><th>貨架</th><th>層板尺寸 cm</th><th>片數</th><th>用板</th></tr></thead>
      <tbody id="材料表內容"></tbody>
    </table>
    <p id="材料表註"></p>
  </section>

  <div id="移動">
    <button type="button" id="前進" aria-label="鏡頭往前">▲ 前進</button>
    <button type="button" id="後退" aria-label="鏡頭往後">▼ 後退</button>
  </div>
  <div id="操作提示">單指拖曳＝360° 轉視角｜雙指捏合＝縮放｜雙指拖曳＝平移｜按住前進／後退＝走動</div>

  <div id="調整面板" aria-label="調整尺寸面板"></div>

  <aside id="圖例">
    <strong>貨架圖例</strong>
  </aside>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
    import GUI from "three/addons/libs/lil-gui.module.min.js";

    // ───────────── 雲端存檔（PocketBase，Mac 上的共用存檔） ─────────────
    const SYNC_URL = "https://b5-sync.sdwm.com.tw";
    const PB_SDK_URL = "https://cdn.jsdelivr.net/npm/pocketbase@0.28.1/dist/pocketbase.es.mjs";
    const SYNC_RECORD = "b5warehouse0001";
    // 允許範圍：GUI、網址參數、雲端讀入、寫回前檢查四處共用（後端驗證也用同一組數字）
    // ==== LIMITS BEGIN ====
    const LIMITS = {
      room: { length: { min: 100, max: 1000 }, width: { min: 100, max: 600 }, ceiling: { min: 150, max: 600 } },
      rackHeight: 300,
      minSpan: 5,
      minLevelGap: 1,
      maxLevels: 10,
      maxDataBytes: 20480
    };
    // ==== LIMITS END ====
    const cloud = { pb: null, status: "connecting", urlOverride: false, edited: false, notice: "", saveTimer: 0, saving: false, updated: "", newer: false, rejected: [], paused: false, rev: 0 };

    // ───────────── 單一資料源：所有尺寸、貨架、標籤、材料表、尺寸線都由此產生 ─────────────
    // ==== DEFAULT_DESIGN BEGIN ====
    const DEFAULT_DESIGN = {
      room: { length: 530, width: 251, ceiling: 400 },
      boardThickness: 0.6,
      rackHeight: 300,
      sheetMax: 244,
      door: { x0: 0, x1: 90, swing: "out", height: 210, labelOffset: { x: 38, z: 71 } },
      racks: [
        {
          id: "A", name: "A 架", color: "#0072b2", pdfColor: "紅", axis: "x", prev: null, zFrom: "z0",
          x0: 0, x1: 186, z0: 0, z1: 77, levels: [81, 141, 201, 261],
          hl: { dx: 7, zRef: "z1", dz: 7 },
          pdfSize: "77 × 186",
          stock: "3×7 尺（91×212）4 張", stockBasis: [77, 186, 4]
        },
        {
          id: "B", name: "B 架", color: "#e69f00", pdfColor: "紅", axis: "x", prev: "A", zFrom: "z0",
          x0: 186, x1: 389, z0: 0, z1: 77, levels: [81, 141, 201, 261],
          hl: { dx: 7, zRef: "z1", dz: 7 },
          pdfSize: "77 × 203",
          stock: "3×7 尺（91×212）4 張", stockBasis: [77, 203, 4]
        },
        {
          id: "C", name: "C 小格", color: "#cc79a7", pdfColor: "紅", axis: "x", prev: "B", zFrom: "z0",
          x0: 389, x1: 449, z0: 0, z1: 49, levels: [81, 168, 261],
          hl: { dx: 6, zRef: "z1", dz: 7 },
          pdfSize: "60 × 49",
          stock: "3×6 尺（91×182）1 張", stockBasis: [49, 60, 3]
        },
        {
          id: "D", name: "D 架", color: "#009e73", pdfColor: "綠", axis: "z", prev: "C", zFrom: "z0",
          x0: 454, x1: 530, z0: 0, z1: 251, levels: [61, 121, 181, 241, 300], seamZ: 7, seamFrom: "離 A／B 架那側牆",
          hl: { dx: -7, zRef: 0, dz: 20 },
          pdfSize: "76 × 251",
          stock: "4×8 尺（122×244）5 張＋拼接", stockBasis: [76, 251, 5]
        },
        {
          id: "E", name: "E 架", color: "#d7263d", pdfColor: "橘", axis: "x", prev: null, zFrom: "z1",
          x0: 163.5, x1: 389, z0: 169, z1: 251, levels: [81, 141, 201, 261],
          hl: { dx: 6.5, zRef: "z0", dz: -7 },
          pdfSize: "82 × 225.5",
          stock: "4×8 尺（122×244）4 張", stockBasis: [82, 225.5, 4]
        }
      ],
      // 連續尺寸線：沿同一方向把「牆→貨架→間隙→貨架→…→牆」一段一段標出，不標累加座標
      // axis "x"＝沿 X；axis "z"＝沿 Z。anchor：z0＝線在 Z=−offset，zW＝線在 Z=房間寬+offset，x0＝線在 X=−offset
      dimChains: [
        { axis: "x", anchor: "z0", offset: 44, racks: ["A", "B", "C", "D"], gapText: "間隙 ", tick: 5 },
        { axis: "x", anchor: "zW", offset: 18, racks: ["E"], gapText: "間隙 ", tick: 5 },
        { axis: "z", anchor: "x0", offset: 44, racks: ["A", "E"], gapText: "走道 ", tick: 5 }
      ]
    };
    // ==== DEFAULT_DESIGN END ====
    // 執行時使用的設計物件：由 DEFAULT_DESIGN 複製而來，之後可被 GUI、網址、雲端資料改動
    const DESIGN = JSON.parse(JSON.stringify(DEFAULT_DESIGN));
    if (DESIGN.rackHeight !== LIMITS.rackHeight) DESIGN.rackHeight = LIMITS.rackHeight; // 架高以 LIMITS 為準（DESIGN.rackHeight 只供建模用）
    const fmt = n => String(Math.round(n * 100) / 100);
    const rackById = id => DESIGN.racks.find(r => r.id === id);
    const rackLen = r => (r.axis === "z" ? r.z1 - r.z0 : r.x1 - r.x0);
    const rackDep = r => (r.axis === "z" ? r.x1 - r.x0 : r.z1 - r.z0);
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const MIN_SPAN = LIMITS.minSpan;
    const LABEL_RISE = 16; // 貨架名稱標籤浮在貨架頂端上方的高度
    const labelY = () => DESIGN.rackHeight + LABEL_RISE;

    const app = document.getElementById("app");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe9eef2);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1, 4000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.localClippingEnabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(innerWidth, innerHeight);
    labelRenderer.domElement.style.position = "absolute";
    labelRenderer.domElement.style.inset = "0";
    labelRenderer.domElement.style.pointerEvents = "none";
    app.appendChild(labelRenderer.domElement);

    const roomCenter = () => new THREE.Vector3(DESIGN.room.length / 2, 115, DESIGN.room.width / 2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.075;
    controls.enablePan = true;
    controls.screenSpacePanning = true;
    controls.minDistance = 10;
    controls.maxDistance = 2200;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.target.copy(roomCenter());

    scene.add(new THREE.HemisphereLight(0xffffff, 0x73808b, 2.15));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.15);
    keyLight.position.set(180, 650, 420);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -500;
    keyLight.shadow.camera.right = 500;
    keyLight.shadow.camera.top = 500;
    keyLight.shadow.camera.bottom = -500;
    keyLight.shadow.camera.near = 100;
    keyLight.shadow.camera.far = 1200;
    scene.add(keyLight);

    // 共用材質（重建時不 dispose）
    const floorMaterial = new THREE.MeshStandardMaterial({ color: 0xd4d7d9, roughness: 0.95, metalness: 0 });
    const wallMaterial = new THREE.MeshBasicMaterial({
      color: 0x8aa0af,
      transparent: true,
      opacity: 0.15,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const wallLineMaterial = new THREE.LineBasicMaterial({ color: 0x536674, transparent: true, opacity: 0.78 });
    const doorMaterial = new THREE.MeshStandardMaterial({
      color: 0x9aa3ab, transparent: true, opacity: 0.6, roughness: 0.8, side: THREE.DoubleSide
    });
    const doorEdgeMaterial = new THREE.LineBasicMaterial({ color: 0x315b75 });
    const hingeMaterial = new THREE.MeshStandardMaterial({ color: 0x31434f, roughness: 0.65 });
    const arcMaterial = new THREE.LineDashedMaterial({ color: 0x326888, dashSize: 5, gapSize: 3 });
    const dimensionMaterial = new THREE.LineBasicMaterial({ color: 0x263b49, depthTest: false });
    const SHARED_MATERIALS = new Set([
      floorMaterial, wallMaterial, wallLineMaterial, doorMaterial, doorEdgeMaterial,
      hingeMaterial, arcMaterial, dimensionMaterial
    ]);

    function addSegments(group, points, material = wallLineMaterial) {
      const line = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(points), material);
      group.add(line);
      return line;
    }

    function addLabel(group, text, x, height, z, className, background) {
      const element = document.createElement("div");
      element.className = className;
      element.textContent = text;
      if (background) element.style.background = background;
      const label = new CSS2DObject(element);
      label.position.set(x, height, z);
      group.add(label);
      return label;
    }

    // 釋放：geometry／非共用 material dispose，CSS2DObject 的 DOM 元素移除（three.js 手冊 how-to-dispose-of-objects）
    function disposeTree(root) {
      root.traverse(obj => {
        if (obj.isCSS2DObject) obj.element.remove();
        if (obj.geometry) obj.geometry.dispose();
        const mats = Array.isArray(obj.material) ? obj.material : obj.material ? [obj.material] : [];
        for (const m of mats) if (!SHARED_MATERIALS.has(m)) m.dispose();
      });
      root.removeFromParent();
    }

    // ───────────── 房間（牆、門、地板） ─────────────
    function buildRoom() {
      const { length: L, width: W, ceiling: H } = DESIGN.room;
      const d = DESIGN.door;
      const doorW = d.x1 - d.x0;
      const sign = d.swing === "out" ? 1 : -1;
      const g = new THREE.Group();
      g.name = "room";

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(L, W), floorMaterial);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(L / 2, -0.08, W / 2);
      floor.receiveShadow = true;
      floor.userData.isFloor = true;
      g.add(floor);

      const wallAtZ = (x0, x1, z, h0 = 0, h1 = H) => {
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, h1 - h0), wallMaterial);
        mesh.position.set((x0 + x1) / 2, (h0 + h1) / 2, z);
        g.add(mesh);
      };
      const wallAtX = (z0, z1, x, h0 = 0, h1 = H) => {
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(z1 - z0, h1 - h0), wallMaterial);
        mesh.rotation.y = Math.PI / 2;
        mesh.position.set(x, (h0 + h1) / 2, (z0 + z1) / 2);
        g.add(mesh);
      };
      const outlineZ = (x0, x1, z, h0, h1) => addSegments(g, [
        new THREE.Vector3(x0, h0, z), new THREE.Vector3(x1, h0, z),
        new THREE.Vector3(x1, h0, z), new THREE.Vector3(x1, h1, z),
        new THREE.Vector3(x1, h1, z), new THREE.Vector3(x0, h1, z),
        new THREE.Vector3(x0, h1, z), new THREE.Vector3(x0, h0, z)
      ]);
      const outlineX = (z0, z1, x, h0, h1) => addSegments(g, [
        new THREE.Vector3(x, h0, z0), new THREE.Vector3(x, h0, z1),
        new THREE.Vector3(x, h0, z1), new THREE.Vector3(x, h1, z1),
        new THREE.Vector3(x, h1, z1), new THREE.Vector3(x, h1, z0),
        new THREE.Vector3(x, h1, z0), new THREE.Vector3(x, h0, z0)
      ]);

      wallAtZ(0, L, 0);
      wallAtX(0, W, 0);
      wallAtX(0, W, L);
      if (d.x0 > 0) wallAtZ(0, d.x0, W);
      if (d.x1 < L) wallAtZ(d.x1, L, W);
      wallAtZ(d.x0, d.x1, W, d.height, H);

      outlineZ(0, L, 0, 0, H);
      outlineX(0, W, 0, 0, H);
      outlineX(0, W, L, 0, H);
      if (d.x0 > 0) outlineZ(0, d.x0, W, 0, H);
      if (d.x1 < L) outlineZ(d.x1, L, W, 0, H);
      outlineZ(d.x0, d.x1, W, d.height, H);

      addSegments(g, [
        new THREE.Vector3(0, H, 0), new THREE.Vector3(L, H, 0),
        new THREE.Vector3(L, H, 0), new THREE.Vector3(L, H, W),
        new THREE.Vector3(L, H, W), new THREE.Vector3(0, H, W),
        new THREE.Vector3(0, H, W), new THREE.Vector3(0, H, 0),
        new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, H, 0),
        new THREE.Vector3(L, 0, 0), new THREE.Vector3(L, H, 0),
        new THREE.Vector3(L, 0, W), new THREE.Vector3(L, H, W),
        new THREE.Vector3(d.x0, d.height, W), new THREE.Vector3(d.x0, H, W)
      ]);

      const door = new THREE.Mesh(new THREE.BoxGeometry(2, d.height, doorW), doorMaterial);
      door.position.set(d.x1, d.height / 2, W + sign * doorW / 2);
      door.castShadow = true;
      g.add(door);

      const doorEdges = new THREE.LineSegments(new THREE.EdgesGeometry(door.geometry), doorEdgeMaterial);
      doorEdges.position.copy(door.position);
      g.add(doorEdges);

      const hinge = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, d.height + 4, 14), hingeMaterial);
      hinge.position.set(d.x1, d.height / 2 + 2, W);
      g.add(hinge);

      const arcPoints = [];
      for (let i = 0; i <= 36; i++) {
        const angle = (Math.PI / 2) * (i / 36);
        arcPoints.push(new THREE.Vector3(
          d.x1 - doorW * Math.cos(angle),
          0.7,
          W + sign * doorW * Math.sin(angle)
        ));
      }
      const arc = new THREE.Line(new THREE.BufferGeometry().setFromPoints(arcPoints), arcMaterial);
      arc.computeLineDistances();
      g.add(arc);

      addLabel(g, `門 ${fmt(doorW)}（向${d.swing === "out" ? "外" : "內"}開）`,
        d.x0 + d.labelOffset.x, 5, W + sign * d.labelOffset.z, "地面標籤");
      return g;
    }

    // ───────────── 貨架（每個貨架一個 Group） ─────────────
    function darken(hex, amount = 0.56) {
      const c = new THREE.Color(hex);
      c.multiplyScalar(amount);
      return c;
    }

    function buildRack(rack) {
      const g = new THREE.Group();
      g.name = `rack-${rack.id}`;
      const t = DESIGN.boardThickness;
      const color = new THREE.Color(rack.color);
      const darkColor = darken(rack.color);
      const boardMaterial = new THREE.MeshStandardMaterial({ color, roughness: 0.72, metalness: 0.05 });
      const postMaterial = new THREE.MeshStandardMaterial({ color: darkColor, roughness: 0.68, metalness: 0.1 });
      const edgeMaterial = new THREE.LineBasicMaterial({ color: darkColor });
      const seamMaterial = new THREE.LineBasicMaterial({ color: 0x00402d });
      const hl = rack.hl;
      const hlx = rack.x0 + hl.dx;
      const hlz = (hl.zRef ? rack[hl.zRef] : 0) + hl.dz;
      const needSeam = rack.seamZ !== undefined && rackLen(rack) > DESIGN.sheetMax;

      for (const [li, height] of rack.levels.entries()) {
        const geometry = new THREE.BoxGeometry(rack.x1 - rack.x0, t, rack.z1 - rack.z0);
        const board = new THREE.Mesh(geometry, boardMaterial);
        board.position.set((rack.x0 + rack.x1) / 2, height - t / 2, (rack.z0 + rack.z1) / 2);
        board.castShadow = true;
        board.receiveShadow = true;
        board.userData.rack = true;
        g.add(board);

        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geometry), edgeMaterial);
        edges.position.copy(board.position);
        edges.userData.rack = true;
        g.add(edges);

        addLabel(g, `第${li + 1}層 ${fmt(height - (li > 0 ? rack.levels[li - 1] : 0))}`, hlx, height + 2, hlz, "高度標籤");

        if (needSeam) {
          g.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
              new THREE.Vector3(rack.x0, height + 0.04, rack.seamZ),
              new THREE.Vector3(rack.x1, height + 0.04, rack.seamZ)
            ]),
            seamMaterial
          ));
        }
      }

      const corners = [
        [rack.x0 + 2, rack.z0 + 2],
        [rack.x0 + 2, rack.z1 - 2],
        [rack.x1 - 2, rack.z0 + 2],
        [rack.x1 - 2, rack.z1 - 2]
      ];
      for (const [x, z] of corners) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(4, DESIGN.rackHeight, 4), postMaterial);
        post.position.set(x, DESIGN.rackHeight / 2, z);
        post.castShadow = true;
        post.receiveShadow = true;
        post.userData.rack = true;
        g.add(post);
      }

      addLabel(
        g,
        `${rack.name} ${fmt(rackLen(rack))}×${fmt(rackDep(rack))}`,
        (rack.x0 + rack.x1) / 2,
        labelY(),
        (rack.z0 + rack.z1) / 2,
        "貨架標籤",
        `#${color.getHexString()}`
      );
      return g;
    }

    // ───────────── 尺寸線（依貨架／房間位置算出） ─────────────
    // 把一條連續尺寸鏈切成逐段：[{a, b, text, gap}]，a／b 是沿線座標（只在畫圖時用，不顯示）
    function chainPieces(chain) {
      const lo = r => (chain.axis === "x" ? r.x0 : r.z0);
      const hi = r => (chain.axis === "x" ? r.x1 : r.z1);
      const end = chain.axis === "x" ? DESIGN.room.length : DESIGN.room.width;
      const pieces = [];
      let cursor = 0;
      for (const r of chain.racks.map(rackById)) {
        if (lo(r) - cursor > 1e-6) {
          pieces.push({ a: cursor, b: lo(r), text: (cursor > 0 ? chain.gapText : "") + fmt(lo(r) - cursor), gap: cursor > 0 });
        }
        pieces.push({ a: lo(r), b: hi(r), text: fmt(hi(r) - lo(r)), gap: false });
        cursor = hi(r);
      }
      if (end - cursor > 1e-6) pieces.push({ a: cursor, b: end, text: fmt(end - cursor), gap: false });
      return pieces;
    }

    function buildDims() {
      const { length: L, width: W } = DESIGN.room;
      const g = new THREE.Group();
      g.name = "dims";
      const dimensionLine = (a, b, ta1, ta2, tb1, tb2) => addSegments(g, [
        new THREE.Vector3(...a), new THREE.Vector3(...b),
        new THREE.Vector3(...ta1), new THREE.Vector3(...ta2),
        new THREE.Vector3(...tb1), new THREE.Vector3(...tb2)
      ], dimensionMaterial);

      dimensionLine([0, 0.8, -18], [L, 0.8, -18], [0, 0.8, -24], [0, 0.8, -12], [L, 0.8, -24], [L, 0.8, -12]);
      addLabel(g, `房間長 ${fmt(L)}`, L / 2, 3, -18, "尺寸標籤");
      dimensionLine([-18, 0.8, 0], [-18, 0.8, W], [-24, 0.8, 0], [-12, 0.8, 0], [-24, 0.8, W], [-12, 0.8, W]);
      addLabel(g, `房間寬 ${fmt(W)}`, -18, 3, W / 2, "尺寸標籤");

      for (const chain of DESIGN.dimChains) {
        const at = chain.anchor === "zW" ? W + chain.offset : -chain.offset;
        for (const pc of chainPieces(chain)) {
          const mid = (pc.a + pc.b) / 2;
          const t = chain.tick;
          if (chain.axis === "z") {
            dimensionLine([at, 0.8, pc.a], [at, 0.8, pc.b],
              [at - t, 0.8, pc.a], [at + t, 0.8, pc.a], [at - t, 0.8, pc.b], [at + t, 0.8, pc.b]);
            addLabel(g, pc.text, at, 3, mid, "地面標籤");
          } else {
            dimensionLine([pc.a, 0.8, at], [pc.b, 0.8, at],
              [pc.a, 0.8, at - t], [pc.a, 0.8, at + t], [pc.b, 0.8, at - t], [pc.b, 0.8, at + t]);
            addLabel(g, pc.text, mid, 3, at + (pc.gap ? -10 : 0), "地面標籤");
          }
        }
      }
      return g;
    }

    // ───────────── 圖層／剖切（對重建後的新物件重新套用） ─────────────
    const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), DESIGN.room.ceiling);
    const cutInput = document.getElementById("剖切高度");
    const cutOut = document.getElementById("剖切值");
    const layerState = { 尺寸: true, 層高: true, 名稱: true, 牆面: true };
    const LAYER_CLASSES = {
      尺寸: ["尺寸標籤", "地面標籤"],
      層高: ["高度標籤"],
      名稱: ["貨架標籤"]
    };

    function applyClip(root) {
      root.traverse(obj => {
        if (!(obj.isMesh || obj.isLineSegments || obj.isLine) || obj.userData.isFloor || !obj.material) return;
        const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
        for (const material of materials) {
          if (!material || material === dimensionMaterial) continue;
          material.clippingPlanes = [cutPlane];
          material.clipShadows = true;
        }
      });
    }

    function applyLayers() {
      scene.traverse(obj => {
        if (obj.isLineSegments && obj.material === dimensionMaterial) obj.visible = layerState.尺寸;
        if (obj.material === wallMaterial || obj.material === wallLineMaterial) obj.visible = layerState.牆面;
        if (obj.isCSS2DObject) {
          for (const name of Object.keys(LAYER_CLASSES)) {
            if (LAYER_CLASSES[name].some(c => obj.element.classList.contains(c))) obj.visible = layerState[name];
          }
        }
      });
    }

    function applyCut() {
      const h = Number(cutInput.value);
      const ceiling = DESIGN.room.ceiling;
      cutPlane.constant = h;
      cutOut.textContent = h >= ceiling ? "全部" : `${h} cm 以下`;
      scene.traverse(obj => {
        if (!obj.isCSS2DObject) return;
        if (obj.element.classList.contains("高度標籤")) obj.element.style.opacity = obj.position.y > h ? "0" : "";
        if (obj.element.classList.contains("貨架標籤")) obj.position.y = Math.min(labelY(), h + LABEL_RISE);
      });
    }

    function finishBuild(group) {
      scene.add(group);
      applyClip(group);
      applyLayers();
      applyCut();
    }

    document.querySelectorAll("#圖層 button[data-layer]").forEach(button => {
      button.addEventListener("click", () => {
        const on = button.getAttribute("aria-pressed") !== "true";
        button.setAttribute("aria-pressed", String(on));
        layerState[button.dataset.layer] = on;
        applyLayers();
      });
    });
    cutInput.addEventListener("input", applyCut);

    // ───────────── 重建 ─────────────
    let roomGroup = null;
    let dimGroup = null;
    const rackGroups = new Map();

    function rebuildRoom() {
      if (roomGroup) disposeTree(roomGroup);
      roomGroup = buildRoom();
      finishBuild(roomGroup);
    }
    function rebuildDims() {
      if (dimGroup) disposeTree(dimGroup);
      dimGroup = buildDims();
      finishBuild(dimGroup);
    }
    function rebuildRack(rack) {
      const old = rackGroups.get(rack.id);
      if (old) disposeTree(old);
      const g = buildRack(rack);
      rackGroups.set(rack.id, g);
      finishBuild(g);
    }

    // 頁面文字（圖例、材料表、副標）也由 DESIGN 產生
    function refreshTexts() {
      document.getElementById("副標").textContent =
        `單位 cm｜第1層＝地板到板面，其餘＝層與層板面間距｜板厚 ${fmt(DESIGN.boardThickness * 10)}mm`;

      const legend = document.getElementById("圖例");
      legend.querySelectorAll(".圖例列").forEach(el => el.remove());
      for (const r of DESIGN.racks) {
        const row = document.createElement("div");
        row.className = "圖例列";
        const swatch = document.createElement("span");
        swatch.className = "色塊";
        swatch.style.background = r.color;
        row.append(swatch, `${r.name} ${fmt(rackLen(r))}×${fmt(rackDep(r))}（PDF ${r.pdfColor}）`);
        legend.appendChild(row);
      }

      const tbody = document.getElementById("材料表內容");
      tbody.textContent = "";
      const notes = [];
      for (const r of DESIGN.racks) {
        const dep = rackDep(r);
        const len = rackLen(r);
        const sizeSame = r.stockBasis[0] === dep && r.stockBasis[1] === len;
        const same = sizeSame && r.stockBasis[2] === r.levels.length;
        const tr = document.createElement("tr");
        // 未改尺寸時顯示 PDF 原字串，改過才用計算值並註明（已改）
        for (const text of [r.name, sizeSame ? r.pdfSize : `${fmt(dep)} × ${fmt(len)}（已改）`, String(r.levels.length),
          same ? r.stock : "尺寸已改，用板需重新估算"]) {
          const td = document.createElement("td");
          td.textContent = text;
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
        if (r.seamZ !== undefined && len > DESIGN.sheetMax) {
          notes.push(`${r.name}層板 ${fmt(len)} 長，4×8 尺板只有 ${DESIGN.sheetMax}，拼接縫在${r.seamFrom} ${fmt(r.seamZ)} cm 處（位置待現場確認）。`);
        }
      }
      document.getElementById("材料表註").textContent =
        `來源：B5 小倉庫貨架層板規劃 PDF。板厚 ${fmt(DESIGN.boardThickness * 10)}mm。各段尺寸為逐段量測，總長以房間 ${fmt(DESIGN.room.length)} 為準。${notes.join("")}`;
    }

    function normalizeRack(r, room = DESIGN.room) {
      const { length: L, width: W } = room;
      r.x0 = clamp(r.x0, 0, Math.max(0, L - MIN_SPAN));
      r.x1 = clamp(r.x1, r.x0 + MIN_SPAN, Math.max(r.x0 + MIN_SPAN, L));
      r.z0 = clamp(r.z0, 0, Math.max(0, W - MIN_SPAN));
      r.z1 = clamp(r.z1, r.z0 + MIN_SPAN, Math.max(r.z0 + MIN_SPAN, W));
    }

    function rebuildAll() {
      rebuildRoom();
      DESIGN.racks.forEach(rebuildRack);
      rebuildDims();
      refreshTexts();
    }

    // ───────────── 網址狀態（URLSearchParams＋history.replaceState） ─────────────
    // 只寫與原設計不同的部分；R=長-寬-高，貨架 id=x0-x1-z0-z1-層高_層高_…（分隔符取 URLSearchParams 不會轉義的 - _ .）
    const num = v => String(Math.round(v * 100) / 100);
    function designParams() {
      const p = new URLSearchParams();
      const R = DESIGN.room;
      const R0 = DEFAULT_DESIGN.room;
      if (R.length !== R0.length || R.width !== R0.width || R.ceiling !== R0.ceiling) {
        p.set("R", [R.length, R.width, R.ceiling].map(num).join("-"));
      }
      for (const r of DESIGN.racks) {
        const d = DEFAULT_DESIGN.racks.find(x => x.id === r.id);
        const mine = [r.x0, r.x1, r.z0, r.z1].map(num).join("-") + "-" + r.levels.map(num).join("_");
        const base = [d.x0, d.x1, d.z0, d.z1].map(num).join("-") + "-" + d.levels.map(num).join("_");
        if (mine !== base) p.set(r.id, mine);
      }
      return p;
    }

    // 網址只在「雲端未連線」時自動更新；雲端連線時網址參數只用來分享特定版本
    function urlWithDesign(qs) {
      const keepDebug = new URLSearchParams(location.search).has("debug") ? "debug" : "";
      const full = [qs, keepDebug].filter(Boolean).join("&");
      return `${location.pathname}${full ? "?" + full : ""}${location.hash}`;
    }
    function syncUrl() {
      try {
        history.replaceState(null, "", urlWithDesign(designParams().toString()));
      } catch (e) {
        console.warn("replaceState 失敗", e);
      }
    }
    function clearDesignParams() {
      try {
        history.replaceState(null, "", urlWithDesign(""));
      } catch (e) {
        console.warn("replaceState 失敗", e);
      }
    }
    let urlTimer = 0;
    function scheduleUrlSync() {
      if (cloud.status !== "offline") return;
      clearTimeout(urlTimer);
      urlTimer = setTimeout(syncUrl, 250);
    }

    // ───────────── 資料驗證（網址、雲端讀入、寫回前共用；輸入一律當不可信） ─────────────
    // OWASP Input Validation：同時驗語法（型別、格式）與語意（數值在此用途下是否合理）
    const MAX_LEVELS = LIMITS.maxLevels;
    const isFiniteNum = v => typeof v === "number" && Number.isFinite(v);
    const inRange = (v, lim) => isFiniteNum(v) && v >= lim.min && v <= lim.max;
    const asObj = v => (v && typeof v === "object" && !Array.isArray(v) ? v : null);
    // 一座貨架是否合規：座標在房間內、長深 ≥ minSpan、與前一物件（X 鏈）及已放置的其他貨架（X、Z 兩方向）不重疊、
    // 層距 > 0 且嚴格遞增、最高層 ≤ min(架高, 天花板)
    function rackOk(c, room, prev, placed = []) {
      if (!c || ![c.x0, c.x1, c.z0, c.z1].every(isFiniteNum)) return false;
      if (c.x0 < 0 || c.z0 < 0 || c.x1 > room.length || c.z1 > room.width) return false;
      if (c.x1 - c.x0 < LIMITS.minSpan || c.z1 - c.z0 < LIMITS.minSpan) return false;
      if (prev && c.x0 < prev.x1 - 1e-6) return false;
      for (const o of placed) {
        if (c.x0 < o.x1 - 1e-6 && o.x0 < c.x1 - 1e-6 && c.z0 < o.z1 - 1e-6 && o.z0 < c.z1 - 1e-6) return false;
      }
      const lv = c.levels;
      if (!Array.isArray(lv) || lv.length < 1 || lv.length > LIMITS.maxLevels) return false;
      let last = 0;
      for (const h of lv) {
        if (!isFiniteNum(h) || h - last < LIMITS.minLevelGap - 1e-6) return false;
        last = h;
      }
      return last <= Math.min(LIMITS.rackHeight, room.ceiling) + 1e-6;
    }
    function roomOk(room) {
      return !!room && ["length", "width", "ceiling"].every(k => inRange(room[k], LIMITS.room[k]));
    }
    // 回傳完整的新設計（room＋racks）與 rejected（被丟棄而改用預設的項目名稱）。
    // 房間不合規的欄位、貨架不合規的整架一律丟棄、改用預設值（OWASP：不合規輸入要明確回報，不能悄悄拿部分驗證過的資料繼續）
    function sanitizeDesign(data) {
      const room = { ...DEFAULT_DESIGN.room };
      const racks = DEFAULT_DESIGN.racks.map(r => JSON.parse(JSON.stringify(r)));
      const d = asObj(data);
      const rejected = [];
      const provided = new Set();
      const dr = asObj(d?.room);
      if (dr) {
        let bad = false;
        for (const k of ["length", "width", "ceiling"]) {
          if (inRange(dr[k], LIMITS.room[k])) room[k] = dr[k];
          else if (k in dr) bad = true;
        }
        if (bad) rejected.push("房間尺寸");
      }
      const dracks = asObj(d?.racks);
      racks.forEach((r, i) => {
        const dd = asObj(dracks?.[r.id]);
        if (!dd) return;
        const cand = { x0: dd.x0, x1: dd.x1, z0: dd.z0, z1: dd.z1, levels: Array.isArray(dd.levels) ? dd.levels.slice() : null };
        const prev = r.prev ? racks.find(x => x.id === r.prev) : null;
        if (rackOk(cand, room, prev, racks.slice(0, i))) { Object.assign(r, cand); provided.add(r.id); }
        else rejected.push(r.name);
      });
      // 全部貨架兩兩檢查 X、Z 重疊（CWE-20：相關欄位之間也要一致）。
      // 遠端資料沒給的貨架用預設值，也可能與給了的貨架重疊：把「由資料提供」的那一座退回預設並列入 rejected
      const hit = (a, b) => a.x0 < b.x1 - 1e-6 && b.x0 < a.x1 - 1e-6 && a.z0 < b.z1 - 1e-6 && b.z0 < a.z1 - 1e-6;
      for (let guard = 0; guard < racks.length * racks.length; guard++) {
        let pair = null;
        for (let i = 0; i < racks.length && !pair; i++) {
          for (let j = i + 1; j < racks.length; j++) if (hit(racks[i], racks[j])) { pair = [i, j]; break; }
        }
        if (!pair) break;
        const pick = [pair[1], pair[0]].find(k => provided.has(racks[k].id));
        if (pick === undefined) break; // 兩座都是預設值（預設設計本身不重疊，不會發生）
        const def = DEFAULT_DESIGN.racks.find(x => x.id === racks[pick].id);
        Object.assign(racks[pick], JSON.parse(JSON.stringify({ x0: def.x0, x1: def.x1, z0: def.z0, z1: def.z1, levels: def.levels })));
        provided.delete(racks[pick].id);
        if (!rejected.includes(racks[pick].name)) rejected.push(racks[pick].name);
      }
      return { room, racks, rejected };
    }
    // 寫回雲端前檢查整份資料；回傳問題描述（固定字串）或 null
    function dataProblem(data) {
      if (!roomOk(data.room)) return "房間尺寸超出允許範圍";
      for (const [i, r] of DESIGN.racks.entries()) {
        const placed = DESIGN.racks.slice(0, i).map(x => data.racks[x.id]);
        if (!rackOk(data.racks[r.id], data.room, r.prev ? data.racks[r.prev] : null, placed)) return `${r.name}尺寸超出允許範圍或與其他貨架重疊`;
      }
      return null;
    }
    const designKey = (room, racks) =>
      JSON.stringify([room.length, room.width, room.ceiling, racks.map(r => [r.id, r.x0, r.x1, r.z0, r.z1, r.levels])]);
    const currentKey = () => designKey(DESIGN.room, DESIGN.racks);
    function commitDesign(sd) {
      DESIGN.room = sd.room;
      sd.racks.forEach((r, i) => { DESIGN.racks[i] = r; });
    }
    function syncCutRange() {
      const prev = Number(cutInput.max);
      const c = DESIGN.room.ceiling;
      const wasAll = Number(cutInput.value) >= prev;
      cutInput.max = String(c);
      cutInput.value = String(wasAll ? c : Math.min(Number(cutInput.value), c));
      applyCut();
    }
    function showDesign(sd) {
      commitDesign(sd);
      rebuildAll();
      refreshGui();
      syncCutRange();
    }
    // 網址參數 → 資料物件（形狀與雲端 data 相同，之後一律經 sanitizeDesign）
    function paramsToData(p) {
      const data = { room: {}, racks: {} };
      const R = p.get("R");
      if (R) {
        const v = R.split("-").map(Number);
        if (v.length === 3) [data.room.length, data.room.width, data.room.ceiling] = v;
      }
      for (const r of DESIGN.racks) {
        const str = p.get(r.id);
        if (!str) continue;
        const parts = str.split("-");
        if (parts.length !== 5) continue;
        const [x0, x1, z0, z1] = parts.slice(0, 4).map(Number);
        data.racks[r.id] = { x0, x1, z0, z1, levels: parts[4].split("_").map(Number) };
      }
      return data;
    }
    // 後端 maxSize 以 bytes 計：用 UTF-8 位元組數，不是 JSON 字串的字元數（中文一字 3 bytes）
    const jsonBytes = v => new TextEncoder().encode(JSON.stringify(v)).length;
    function designToData() {
      return {
        v: 1,
        room: { ...DESIGN.room },
        racks: Object.fromEntries(DESIGN.racks.map(r => [r.id, { x0: r.x0, x1: r.x1, z0: r.z0, z1: r.z1, levels: [...r.levels] }]))
      };
    }
    function restoreDefaults() {
      showDesign(sanitizeDesign(null));
    }

    // ───────────── 面板按鈕（材料表） ─────────────
    function togglePanel(id, on) {
      document.getElementById(id).hidden = !on;
      const btn = document.getElementById("開材料表");
      btn.setAttribute("aria-expanded", String(on));
      if (on) document.getElementById(id).querySelector(".關閉").focus();
      else btn.focus();
    }
    // Esc 關閉目前開著的面板（WAI-ARIA APG Dialog：Escape closes the dialog）
    document.addEventListener("keydown", e => {
      if (e.key !== "Escape") return;
      if (!document.getElementById("材料表").hidden) togglePanel("材料表", false);
    });
    document.getElementById("開材料表").addEventListener("click", () => togglePanel("材料表", document.getElementById("材料表").hidden));
    document.querySelectorAll(".關閉").forEach(b => b.addEventListener("click", () => togglePanel(b.dataset.close, false)));

    // ───────────── lil-gui 調整面板 ─────────────
    const prox = (get, set) => ({ get v() { return get(); }, set v(x) { set(x); } });
    const gui = new GUI({ container: document.getElementById("調整面板"), title: "調整尺寸" });
    const rangeCtrls = []; // [controller, () => max]
    const rackFolders = new Map();
    const levelFolders = new Map();

    function afterChange() {
      DESIGN.racks.forEach(r => normalizeRack(r));
      DESIGN.racks.forEach(rebuildRack);
      rebuildDims();
      refreshTexts();
      noteLocalEdit();
      rackFolders.forEach(f => f.controllersRecursive().forEach(c => c.updateDisplay()));
    }

    // ── 連續尺寸：GUI 只顯示／輸入各段自己的尺寸；內部仍存座標（建模用）──
    const r1 = v => Math.round(v * 10) / 10;
    const topLimit = () => Math.min(LIMITS.rackHeight, DESIGN.room.ceiling);
    const levelGap = (rack, i) => r1(rack.levels[i] - (i > 0 ? rack.levels[i - 1] : 0));
    // 改第 i 層的層距：該層以上整體上移／下移（前綴和），總高夾在 ≤ 架高與天花板
    function setLevelGap(rack, i, v) {
      const lv = rack.levels;
      const cur = lv[i] - (i > 0 ? lv[i - 1] : 0);
      const maxV = Math.max(LIMITS.minLevelGap, topLimit() - (lv[lv.length - 1] - cur));
      const d = r1(clamp(v, LIMITS.minLevelGap, maxV)) - cur;
      for (let j = i; j < lv.length; j++) lv[j] = r1(lv[j] + d);
    }
    function shiftChain(rack, dx) {
      for (const d of DESIGN.racks) {
        if (d.prev !== rack.id) continue;
        d.x0 = r1(d.x0 + dx);
        d.x1 = r1(d.x1 + dx);
        shiftChain(d, dx);
      }
    }
    // 改一座貨架在 X 方向的位置或長度；排在它後面的貨架（prev 鏈）整體平移
    function setRackX(rack, x0, x1) {
      const dx = r1(x1) - rack.x1;
      rack.x0 = r1(x0);
      rack.x1 = r1(x1);
      if (dx) shiftChain(rack, dx);
    }
    const prevEdge = rack => (rack.prev ? rackById(rack.prev).x1 : 0);

    function buildLevelControls(id) {
      levelFolders.get(id)?.destroy();
      const rack = rackById(id);
      const folder = rackFolders.get(id).addFolder("各層高度（層距）");
      levelFolders.set(id, folder);
      rack.levels.forEach((_, i) => {
        const label = i === 0 ? "第 1 層（離地板）" : `第 ${i + 1} 層（離第 ${i} 層）`;
        folder.add(prox(() => levelGap(rackById(id), i), v => setLevelGap(rackById(id), i, v)), "v", LIMITS.minLevelGap, LIMITS.rackHeight, 1)
          .name(label)
          .onChange(() => afterChange());
      });
    }

    function setLevelCount(rack, n) {
      const lv = rack.levels;
      while (lv.length > n) lv.pop();
      while (lv.length < n) {
        const last = lv[lv.length - 1] ?? 0;
        const step = lv.length >= 2 ? last - lv[lv.length - 2] : 60;
        const room = topLimit() - last;
        if (room < LIMITS.minLevelGap) break;
        lv.push(r1(last + Math.min(step, room)));
      }
    }

    function addRackFolder(rack) {
      const id = rack.id;
      const R = () => rackById(id);
      const folder = gui.addFolder(rack.name);
      folder.close();
      rackFolders.set(id, folder);
      const L = () => DESIGN.room.length;
      const W = () => DESIGN.room.width;
      const add = (get, set, name, min, max) => {
        const c = folder.add(prox(get, set), "v", min, max(), 0.5).name(name).onChange(() => afterChange());
        rangeCtrls.push([c, max]);
        return c;
      };
      const prevName = rack.prev ? rackById(rack.prev).name : null;
      add(() => r1(R().x0 - prevEdge(R())), v => { const len = R().x1 - R().x0; setRackX(R(), prevEdge(R()) + v, prevEdge(R()) + v + len); },
        prevName ? `離${prevName}（X 間距）` : "離左牆（X 間距）", 0, L);
      add(() => r1(R().x1 - R().x0), v => setRackX(R(), R().x0, R().x0 + v), "長（X 方向）", LIMITS.minSpan, L);
      add(() => r1(R().z1 - R().z0), v => {
        if (R().zFrom === "z1") R().z0 = r1(R().z1 - v); else R().z1 = r1(R().z0 + v);
      }, "深（Z 方向）", LIMITS.minSpan, W);
      const fromBack = rack.zFrom === "z1";
      add(() => (fromBack ? r1(W() - R().z1) : r1(R().z0)), v => {
        const dep = R().z1 - R().z0;
        if (fromBack) { R().z1 = r1(W() - v); R().z0 = r1(R().z1 - dep); } else { R().z0 = r1(v); R().z1 = r1(v + dep); }
      }, fromBack ? "離後牆（Z 間距）" : "離前牆（Z 間距）", 0, W);
      folder.add(prox(() => R().levels.length, v => { setLevelCount(R(), Math.round(v)); }), "v", 1, MAX_LEVELS, 1)
        .name("層數")
        .onChange(() => { buildLevelControls(id); afterChange(); });
      buildLevelControls(id);
    }

    // ───────────── 雲端同步（不需登入；後端權限由 Mac 端設定） ─────────────
    const canSave = () => !!cloud.pb && cloud.status === "online";
    let statusEl = null;
    let ackCtrl = null;

    // 最後編輯時間：record 的 updated 欄位（PocketBase autodate），以台灣時間顯示
    const TAIPEI_FMT = new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    });
    function formatTaipei(updated) {
      if (typeof updated !== "string" || !updated) return "—";
      const d = new Date(updated.replace(" ", "T"));
      if (Number.isNaN(d.getTime())) return "—";
      const p = Object.fromEntries(TAIPEI_FMT.formatToParts(d).map(x => [x.type, x.value]));
      return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`;
    }

    // 狀態文字全是固定字串（lil-gui 的 name 走 innerHTML，不放動態內容；title 這裡用 textContent）
    function renderCloudUi() {
      const msgs = [];
      if (cloud.rejected.length) msgs.push(`雲端資料中 ${cloud.rejected.join("、")}不合規，已改用預設，暫停自動存回`);
      if (cloud.newer) msgs.push("雲端有較新版本，按「改看雲端最新版」可切換");
      if (cloud.notice) msgs.push(cloud.notice);
      if (cloud.status === "connecting") msgs.push("連線雲端中…");
      else if (cloud.status === "offline") msgs.push("雲端未連線，顯示本機版本");
      else {
        if (cloud.urlOverride) msgs.push("目前顯示網址內的版本，非雲端最新");
        if (!msgs.length) msgs.push("雲端已同步，修改會自動存到雲端");
      }
      const last = `最後編輯：${cloud.status === "online" ? formatTaipei(cloud.updated) : "—"}`;
      gui.$title.textContent = `調整尺寸｜${msgs[0]}`;
      if (statusEl) statusEl.textContent = [...msgs, last].join("\n");
      document.getElementById("最後編輯").textContent = last;
      ackCtrl?.show(cloud.paused);
      layoutGui();
    }

    function noteLocalEdit() {
      if (cloud.paused) {
        // 雲端資料有不合規項目：先不自動存回，等使用者按確認
        cloud.edited = true;
        renderCloudUi();
      } else if (canSave()) scheduleCloudSave();
      else {
        cloud.edited = true;
        cloud.notice = cloud.status === "offline" ? "雲端未連線，修改不會同步" : "";
        renderCloudUi();
      }
      scheduleUrlSync();
    }

    // 連續拖曳只送最後一次：每次改值都重設 600ms 計時
    function scheduleCloudSave() {
      clearTimeout(cloud.saveTimer);
      cloud.edited = true;
      cloud.rev += 1;
      cloud.notice = "儲存中…";
      renderCloudUi();
      cloud.saveTimer = setTimeout(doSave, 600);
    }
    const SAVE_ERROR_REASON = { 400: "資料被拒", 403: "沒有權限", 404: "找不到存檔", 429: "太頻繁" };
    function saveErrorText(e) {
      const st = Number(e?.status) || 0;
      if (!st) return "雲端存檔失敗（網路錯誤），本機修改未同步";
      const why = SAVE_ERROR_REASON[st] ? ` ${SAVE_ERROR_REASON[st]}` : "";
      return `雲端存檔失敗（${st}${why}），本機修改未同步`;
    }
    async function doSave() {
      cloud.saveTimer = 0;
      if (!canSave() || cloud.paused) return;
      const data = designToData();
      const problem = dataProblem(data);
      if (problem) {
        cloud.notice = `${problem}，未同步到雲端`;
        renderCloudUi();
        return;
      }
      if (jsonBytes(data) > LIMITS.maxDataBytes) {
        cloud.notice = "資料過大，未同步到雲端";
        renderCloudUi();
        return;
      }
      const rev = cloud.rev;
      cloud.saving = true;
      try {
        const rec = await cloud.pb.collection("designs").update(SYNC_RECORD, { data });
        if (cloud.urlOverride) { cloud.urlOverride = false; clearDesignParams(); }
        cloud.updated = typeof rec?.updated === "string" ? rec.updated : cloud.updated;
        // 存檔期間又改過（版本號變了或已排下一次存檔）就不能宣告「已同步」，保留 edited 以免被遠端版本蓋掉
        if (rev === cloud.rev && !cloud.saveTimer) {
          cloud.edited = false;
          cloud.newer = false;
          cloud.notice = "已存到雲端";
        }
      } catch (e) {
        if (e?.isAbort) return;
        cloud.edited = true;
        cloud.notice = saveErrorText(e);
      } finally {
        cloud.saving = false;
        renderCloudUi();
      }
    }

    // 採用一份雲端資料：記下被拒項目（有的話暫停自動存回），內容與畫面相同就不重建
    function adoptRemote(data) {
      const sd = sanitizeDesign(data);
      cloud.rejected = sd.rejected;
      cloud.paused = sd.rejected.length > 0;
      if (designKey(sd.room, sd.racks) !== currentKey()) showDesign(sd);
      cloud.edited = false;
      cloud.newer = false;
      renderCloudUi();
    }
    // 收到雲端版本：本機有未存修改（編輯中、存檔中、存檔失敗、離線改過）或在看網址版本時一律不覆蓋，
    // 改提示有較新版本，由使用者按「改看雲端最新版」切換
    function onRemote(data) {
      if (cloud.urlOverride) return;
      if (cloud.saveTimer || cloud.saving || cloud.edited) {
        const sd = sanitizeDesign(data);
        if (designKey(sd.room, sd.racks) !== currentKey()) {
          cloud.newer = true;
          renderCloudUi();
        }
        return;
      }
      adoptRemote(data);
    }
    async function fetchLatest() {
      const rec = await cloud.pb.collection("designs").getOne(SYNC_RECORD);
      cloud.status = "online";
      cloud.updated = typeof rec.updated === "string" ? rec.updated : "";
      onRemote(rec.data);
      renderCloudUi();
    }
    function goOffline() {
      if (cloud.status === "online") return;
      cloud.status = "offline";
      syncUrl();
      renderCloudUi();
    }
    async function initCloud() {
      let PocketBase;
      try {
        ({ default: PocketBase } = await import(PB_SDK_URL));
      } catch {
        goOffline();
        return;
      }
      cloud.pb = new PocketBase(SYNC_URL);
      const timer = setTimeout(goOffline, 8000);
      try {
        await fetchLatest();
      } catch {
        clearTimeout(timer);
        goOffline();
        return;
      }
      clearTimeout(timer);
      try {
        await cloud.pb.collection("designs").subscribe(SYNC_RECORD, e => {
          if (e.action !== "update") return;
          if (typeof e.record?.updated === "string") cloud.updated = e.record.updated;
          onRemote(e.record?.data);
          renderCloudUi();
        });
        // 斷線重連後補抓最新（SSE 重連期間的事件不會補送）
        cloud.pb.realtime.subscribe("PB_CONNECT", () => { fetchLatest().catch(() => {}); });
      } catch {
        /* 即時訂閱失敗時，仍可靠開頁時抓到的資料 */
      }
      renderCloudUi();
    }
    async function showCloudLatest() {
      if (!cloud.pb || cloud.status !== "online") { cloud.notice = "雲端未連線，無法載入"; renderCloudUi(); return; }
      try {
        const rec = await cloud.pb.collection("designs").getOne(SYNC_RECORD);
        cloud.urlOverride = false;
        cloud.notice = "";
        cloud.updated = typeof rec.updated === "string" ? rec.updated : "";
        clearDesignParams();
        adoptRemote(rec.data);
      } catch {
        cloud.notice = "載入雲端版本失敗";
      }
      renderCloudUi();
    }

    const actions = {
      copy() {
        // 分享網址只帶「與原設計不同」的參數，不改動網址列
        const u = new URL(location.href);
        u.search = urlWithDesign(designParams().toString()).split("?")[1] ?? "";
        const done = () => { shareCtrl.name("已複製 ✓"); setTimeout(() => shareCtrl.name("複製分享網址"), 1600); };
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(u.href).then(done, () => prompt("複製這個網址", u.href));
        else prompt("複製這個網址", u.href);
      },
      reset() {
        restoreDefaults();
        noteLocalEdit();
      },
      latest: showCloudLatest,
      ack() {
        // 使用者確認：接受「不合規項目已改用預設」的畫面，恢復自動存回並把目前畫面寫回雲端
        cloud.paused = false;
        cloud.rejected = [];
        scheduleCloudSave();
      }
    };
    statusEl = document.createElement("div");
    statusEl.className = "面板說明 狀態列";
    gui.$children.insertBefore(statusEl, gui.$children.firstChild);
    const shareCtrl = gui.add(actions, "copy").name("複製分享網址");
    gui.add(actions, "reset").name("還原原設計");
    gui.add(actions, "latest").name("改看雲端最新版");
    ackCtrl = gui.add(actions, "ack").name("確認改用預設並恢復存回");
    ackCtrl.hide();
    const roomFolder = gui.addFolder("房間");
    roomFolder.close();
    const roomNote = document.createElement("div");
    roomNote.className = "面板說明";
    roomNote.textContent = "縮小房間不會自動移動貨架";
    roomFolder.$children.appendChild(roomNote);
    for (const [key, label] of [["length", "長（X）"], ["width", "寬（Z）"], ["ceiling", "天花板高"]]) {
      roomFolder.add(prox(() => DESIGN.room[key], v => { DESIGN.room[key] = v; }), "v", LIMITS.room[key].min, LIMITS.room[key].max, 1)
        .name(label)
        .onChange(() => {
          syncCutRange();
          rebuildRoom();
          afterChange();
          rangeCtrls.forEach(([c, m]) => c.max(m()));
        });
    }
    DESIGN.racks.forEach(addRackFolder);

    function refreshGui() {
      DESIGN.racks.forEach(r => buildLevelControls(r.id));
      rangeCtrls.forEach(([c, m]) => c.max(m()));
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    // 面板位置：量測左側同欄的既有元件，排在它們下面、圖例／前進後退按鈕上面，避免重疊
    function layoutGui() {
      const host = document.getElementById("調整面板");
      const rectOf = id => document.getElementById(id).getBoundingClientRect();
      const mobile = matchMedia("(max-width: 680px)").matches;
      const viewsEl = document.getElementById("視角按鈕");
      const layersEl = document.getElementById("圖層");
      const hintEl = document.getElementById("操作提示");
      if (mobile) {
        // 標題區高度會隨文字換行變動：視角按鈕、圖層列依實際高度往下排
        viewsEl.style.top = `${rectOf("標題區").bottom + 8}px`;
        layersEl.style.top = `${rectOf("視角按鈕").bottom + 2}px`;
      } else {
        viewsEl.style.top = "";
        layersEl.style.top = "";
        hintEl.style.top = "";
      }
      const hr = host.getBoundingClientRect();
      const sameColumn = r => r.right > hr.left && r.left < hr.right;
      let top = 0;
      for (const id of ["標題區", "視角按鈕", "圖層"]) {
        const r = rectOf(id);
        if (sameColumn(r)) top = Math.max(top, r.bottom);
      }
      top += 8;
      let bottom = innerHeight - 12;
      for (const id of ["圖例", "移動"]) {
        const r = rectOf(id);
        if (sameColumn(r)) bottom = Math.min(bottom, r.top - 8);
      }
      host.style.top = `${top}px`;
      host.style.maxHeight = `${Math.max(80, bottom - top)}px`;
      if (mobile) hintEl.style.top = `${top + gui.$title.getBoundingClientRect().height + 8}px`;
    }
    addEventListener("resize", layoutGui);
    // 展開調整面板時收起操作提示，避免兩者疊在一起
    const hideHintWhenOpen = () => { if (!gui._closed) document.getElementById("操作提示").hidden = true; };
    gui.$title.addEventListener("click", hideHintWhenOpen);
    gui.$title.addEventListener("keydown", e => { if (e.code === "Enter" || e.code === "Space") hideHintWhenOpen(); });
    if (matchMedia("(max-width: 680px)").matches) gui.close();

    // ───────────── 啟動：讀網址 → 建場景 ─────────────
    commitDesign(sanitizeDesign(paramsToData(new URLSearchParams(location.search))));
    // 網址帶了與原設計不同的參數 → 優先顯示網址版本（不被雲端覆蓋）
    cloud.urlOverride = designParams().toString() !== "";
    rebuildAll();
    refreshGui();
    syncCutRange();
    renderCloudUi();
    initCloud();
    controls.target.copy(roomCenter());
    layoutGui();
    document.fonts?.ready.then(layoutGui);

    if (new URLSearchParams(location.search).has("debug")) {
      window.__b5scene = scene;
      window.__b5 = { DESIGN, DEFAULT_DESIGN, renderer, scene, gui, designParams, rackGroups, afterChange, cloud, LIMITS, sanitizeDesign, dataProblem, showDesign, designToData, onRemote, adoptRemote, fetchLatest, chainPieces, formatTaipei, saveErrorText, noteLocalEdit };
    }

    let transition = null;

    function threeDView() {
      const portraitScale = camera.aspect < 0.8 ? 1.62 : 1;
      const target = roomCenter();
      const direction = new THREE.Vector3(0.72, 0.63, 0.88).normalize();
      const distance = 760 * portraitScale;
      return {
        position: target.clone().addScaledVector(direction, distance),
        target,
        up: new THREE.Vector3(0, 1, 0)
      };
    }

    function topView() {
      const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
      const fitDepth = (DESIGN.room.width + 59) / Math.tan(halfFov);
      const fitWidth = (DESIGN.room.length + 80) / (2 * Math.tan(halfFov) * camera.aspect);
      const height = Math.max(760, fitDepth, fitWidth) * 1.08;
      const c = roomCenter();
      return {
        position: new THREE.Vector3(c.x, height, c.z),
        target: new THREE.Vector3(c.x, 0, c.z),
        up: new THREE.Vector3(0, 0, -1)
      };
    }

    function doorwayView() {
      const portraitScale = camera.aspect < 0.8 ? 1.2 : 1;
      return {
        position: new THREE.Vector3(30, 230 * portraitScale, 560 * portraitScale),
        target: new THREE.Vector3(300, 110, 110),
        up: new THREE.Vector3(0, 1, 0)
      };
    }

    function switchView(name, immediate = false) {
      const view = name === "俯視"
        ? topView()
        : name === "門口"
          ? doorwayView()
          : threeDView();

      document.querySelectorAll("#視角按鈕 button").forEach(button => {
        button.classList.toggle("active", button.dataset.view === name);
      });

      if (immediate) {
        camera.position.copy(view.position);
        camera.up.copy(view.up);
        controls.target.copy(view.target);
        camera.lookAt(view.target);
        controls.update();
        return;
      }

      transition = {
        start: performance.now(),
        duration: 720,
        fromPosition: camera.position.clone(),
        fromTarget: controls.target.clone(),
        fromUp: camera.up.clone(),
        toPosition: view.position,
        toTarget: view.target,
        toUp: view.up
      };
    }

    document.querySelectorAll("#視角按鈕 button").forEach(button => {
      button.addEventListener("click", () => switchView(button.dataset.view));
    });

    // 前進／後退：相機與注視點一起沿視線水平方向移動（像人在房間裡走）
    let walkDir = 0;
    let lastWalk = 0;
    function bindWalk(id, dir) {
      const el = document.getElementById(id);
      const stop = () => { walkDir = 0; };
      el.addEventListener("pointerdown", e => {
        e.preventDefault();
        transition = null;
        walkDir = dir;
        lastWalk = performance.now();
        el.setPointerCapture?.(e.pointerId);
      });
      el.addEventListener("pointerup", stop);
      el.addEventListener("pointercancel", stop);
      el.addEventListener("lostpointercapture", stop);
    }
    bindWalk("前進", 1);
    bindWalk("後退", -1);
    function stepWalk(now) {
      if (!walkDir) return;
      const dt = Math.min(0.05, (now - lastWalk) / 1000);
      lastWalk = now;
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      if (forward.lengthSq() < 1e-6) {
        forward.set(0, 0, -1).applyQuaternion(camera.quaternion);
        forward.y = 0;
      }
      forward.normalize().multiplyScalar(walkDir * 150 * dt);
      camera.position.add(forward);
      controls.target.add(forward);
    }

    controls.addEventListener("start", () => {
      const hint = document.getElementById("操作提示");
      if (hint) hint.hidden = true;
      transition = null;
    });

    switchView("立體", true);

    function easeInOut(t) {
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function animate(time) {
      requestAnimationFrame(animate);
      stepWalk(performance.now());

      if (transition) {
        const raw = Math.min(1, (time - transition.start) / transition.duration);
        const eased = easeInOut(raw);

        camera.position.lerpVectors(
          transition.fromPosition,
          transition.toPosition,
          eased
        );
        controls.target.lerpVectors(
          transition.fromTarget,
          transition.toTarget,
          eased
        );
        camera.up.lerpVectors(
          transition.fromUp,
          transition.toUp,
          eased
        ).normalize();

        if (raw >= 1) transition = null;
      }

      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      labelRenderer.setSize(innerWidth, innerHeight);
    });
  </script>

</html>
